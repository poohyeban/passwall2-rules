name: Update PassWall2 Rules

on:
  schedule:
    # UTC; 01:17 and 05:43 in UTC+8. The second run is a retry opportunity.
    - cron: '17 17 * * *'
    - cron: '43 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-passwall2-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install fixed dependency
        run: python -m pip install -r requirements.txt
      - name: Semantic regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch verified official Xray
        run: python -m scripts.fetch_xray
      - name: Generate all rules
        run: python -m scripts.build
      - name: Native Xray and isolated routing checks
        run: python -m scripts.verify
      - name: Deterministic rebuild
        run: |
          find rules dist -type f -exec sha256sum {} + | sort > build/first-sha256.txt
          python -m scripts.build --offline
          find rules dist -type f -exec sha256sum {} + | sort > build/second-sha256.txt
          cmp build/first-sha256.txt build/second-sha256.txt
      - name: Check publication privacy
        run: python -m scripts.privacy --history
      - name: Publish validated changes
        run: |
          git add -- rules/ dist/
          if git diff --cached --quiet; then
            echo "No rule changes detected."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'Update generated PassWall2 rules'
          git push origin HEAD:main
